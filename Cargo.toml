[workspace]
members = ["spectre-rs-core", "spectre-rs-cli", "spectre-rs-gui"]
resolver = "3"

[workspace.package]
version = "0.2.4"

[profile.release]
opt-level = 2 # fast and small wasm
lto = "thin"
codegen-units = 1
strip = "symbols"

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
