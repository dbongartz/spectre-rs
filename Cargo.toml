[workspace]
members = ["spectre-rs-core", "spectre-rs-cli", "spectre-rs-gui"]
resolver = "3"

[workspace.package]
version = "0.3.1"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2
