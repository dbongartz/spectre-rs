[package]
name = "spectre-rs-cli"
version.workspace = true
license.workspace = true
edition = "2024"
description = "A clone of the spectre password manager cli written in Rust."

[[bin]]
name = "spectre-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = [
  "color",
  "derive",
  "env",
  # "usage",
  "help",
  "std",
  # "error-context",
  # "cargo",
] }
colored = "3.1"
rpassword = "7.5.4"
rustyline = "19.0.0"
secstr = "0.5.1"
spectre-rs-core = { path = "../spectre-rs-core" }
