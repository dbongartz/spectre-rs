[package]
name = "spectre-rs-cli"
version = "0.2.0"
edition = "2024"
description = "A clone of the spectre password manager cli written in Rust."

[[bin]]
name = "spectre-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", default-features = false, features = [
  "color",
  "derive",
  "env",
  # "usage",
  "help",
  "std",
  # "error-context",
  # "cargo",
] }
rpassword = "7.4.0"
rustyline = "19.0.0"
secstr = "0.5.1"
spectre-rs = { path = "../spectre-rs" }
