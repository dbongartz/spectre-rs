name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable_suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable_suffix: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            executable_suffix: ""

    steps:
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libvulkan-dev pkg-config

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          version=$(awk '/^\[workspace.package\]$/ { in_section = 1; next } /^\[/ { in_section = 0 } in_section && /^version = / { gsub(/version = |"/, "", $0); print $0; exit }' Cargo.toml)
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match workspace version v${version}" >&2
            exit 1
          fi

      - name: Build release executables
        run: cargo build --release --locked --target ${{ matrix.target }} -p spectre-rs-cli -p spectre-rs-gui

      - name: Stage executables
        shell: bash
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/spectre-rs${{ matrix.executable_suffix }}" "dist/spectre-rs-${GITHUB_REF_NAME}-${{ matrix.target }}${{ matrix.executable_suffix }}"
          cp "target/${{ matrix.target }}/release/spectre-rs-gui${{ matrix.executable_suffix }}" "dist/spectre-rs-gui-${GITHUB_REF_NAME}-${{ matrix.target }}${{ matrix.executable_suffix }}"

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download executables
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: executables-*
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
