[package]
name = "spectre-rs-core"
version = "0.1.3"
edition = "2024"
description = "A clone of the spectre password manager library written in Rust."

[dependencies]
colored = "3.1.1"
hmac = "0.13.0"
scrypt = { version = "0.12.0", default-features = false }
secstr = "0.5.1"
sha2 = "0.11"

# [profile.release]
# opt-level = 3
# debug = false
# lto = true
# codegen-units = 1
# panic = "abort"
# strip = true
# incremental = false
