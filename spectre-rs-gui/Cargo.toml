[package]
name = "spectre-rs-gui"
version.workspace = true
edition = "2024"
description = "Spectre password manager UI written in Rust."

[features]
# Opt-in UI inspection for local development. Blocked in release builds below.
dev-inspection = ["dep:egui_inspection"]

[dependencies]
spectre-rs-core = { path = "../spectre-rs-core" }

colored = "3.1"
eframe = { version = "0.37.0", default-features = false, features = [
  "default_fonts",
  "clipboard",
  "persistence",
  "wgpu_no_default_features",
  "wayland"
] }
egui = "0.37.0"
egui_inspection = { version = "0.37.0", optional = true, default-features = false, features = ["plugin"] }
env_logger = "0.11"
log = "0.4"
# Already in the tree through egui-winit; used directly to read the clipboard back and to
# keep passwords out of clipboard-manager histories.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
mimalloc = "0.1.52"
secstr = "0.5"
wgpu = { version = "30.0", default-features = false, features = [
  "parking_lot",
  "std",
  "vulkan",
] }

[dev-dependencies]
# Already in the tree through epaint; used to check glyph coverage of the bundled fonts.
skrifa = "0.44"
