[package]
name = "spectre-rs"
version = "0.1.0"
edition = "2024"
description = "A clone of the spectre password manager library written in Rust."

[dependencies]
byteorder = "1.5.0"
colored = "3.1.1"
hmac = { version = "0.12.1", features = ["std"] }
scrypt = { version = "0.11.0", default-features = false, features = ["std"] }
secstr = "0.5.1"
sha2 = "0.10"

# [profile.release]
# opt-level = 3
# debug = false
# lto = true
# codegen-units = 1
# panic = "abort"
# strip = true
# incremental = false
