[package]
name = "spectre-rs-ui"
version = "0.1.0"
description = "Spectre password manager UI written in Rust."
authors = ["David Bongartz <d.bongartz@gmail.com"]
edition = "2024"

[dependencies]
spectre-rs = { path = "../spectre-rs" }

egui = "0.33.0"
eframe = { version = "0.33.0", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
]}
log = "0.4"
env_logger = "0.11"
secstr = "0.5"
colored = "3.0"
wgpu = { version = "27.0", default-features = false, features = ["parking_lot", "std", "vulkan"] }
