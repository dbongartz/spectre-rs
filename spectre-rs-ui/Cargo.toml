[package]
name = "spectre-rs-ui"
version = "0.1.1"
edition = "2024"
description = "Spectre password manager UI written in Rust."

[dependencies]
spectre-rs = { path = "../spectre-rs" }

colored = "3.1"
eframe = { version = "0.37.0", default-features = false, features = [
  "default_fonts",
  "wgpu_no_default_features",
  "wayland"
] }
egui = "0.37.0"
env_logger = "0.11"
log = "0.4"
mimalloc = "0.1.52"
secstr = "0.5"
wgpu = { version = "30.0", default-features = false, features = [
  "parking_lot",
  "std",
  "vulkan",
] }
